<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DirBridge IAM Lab</title>
<h1>DirBridge IAM Lab</h1>
<p>Local preview with synthetic data only. No account is created and no password is generated.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/">
  <p><label>Demo employee ID <input name="id_colaborador" maxlength="32" required autocomplete="off"></label></p>
  <p><label>First name <input name="nome" maxlength="80" required autocomplete="off"></label></p>
  <p><label>Last name <input name="sobrenome" maxlength="80" required autocomplete="off"></label></p>
  <p><label><input type="checkbox" name="criar_email"> Preview an email address</label></p>
  <button type="submit">Preview request</button>
</form>
</html>
